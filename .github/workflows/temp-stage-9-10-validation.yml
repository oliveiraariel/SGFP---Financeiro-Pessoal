name: Temporary Stage 9-10 Validation

on:
  push:
    branches:
      - feat/stage-9-10-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: sodium, zip
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: PHP lint
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit src/Tests/Unit
