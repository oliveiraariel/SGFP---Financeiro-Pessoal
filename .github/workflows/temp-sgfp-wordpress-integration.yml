name: Temporary SGFP WordPress Integration Gate

on:
  push:
    branches:
      - feat/stage-9-10-backend

jobs:
  integration:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - clean-v8
          - migrate-v7-to-v8
          - lifecycle
          - backup-restore

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_CLI_ALLOW_ROOT: "1"
      SGFP_BACKUP_KEY: "ci-integration-key"
      SGFP_BACKUP_DIR: "/tmp/sgfp-backups"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mysqli, sodium, zip
          coverage: none

      - name: Install plugin dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist

      - name: Install WP-CLI
        run: |
          curl -L -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp
          wp --info

      - name: Install isolated WordPress
        run: |
          rm -rf /tmp/wordpress /tmp/sgfp-backups
          mkdir -p /tmp/wordpress /tmp/sgfp-backups
          wp core download --path=/tmp/wordpress --force
          wp config create             --path=/tmp/wordpress             --dbname=wordpress             --dbuser=wordpress             --dbpass=wordpress             --dbhost=127.0.0.1:3306             --skip-check
          wp core install             --path=/tmp/wordpress             --url=http://sgfp.test             --title="SGFP Integration"             --admin_user=admin             --admin_password="Admin!Integration123"             --admin_email=admin@example.test             --skip-email
          mkdir -p /tmp/wordpress/wp-content/plugins/sgfp
          rsync -a --delete "$GITHUB_WORKSPACE/src/" /tmp/wordpress/wp-content/plugins/sgfp/
          wp plugin activate sgfp --path=/tmp/wordpress

      - name: Run integration scenario
        env:
          SGFP_INTEGRATION_SCENARIO: ${{ matrix.scenario }}
        run: |
          wp eval-file "$GITHUB_WORKSPACE/.github/ci/sgfp-wordpress-integration.php"             --path=/tmp/wordpress
