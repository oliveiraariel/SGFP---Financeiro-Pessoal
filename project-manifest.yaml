schema_version: "1.0"
manifest_version: "2.3"
updated_at: "2026-08-30"

project:
  name: "Sistema de Gestão Financeira Pessoal"
  acronym: "SGFP"
  language: "pt-BR"
  project_type: "academic_software_project"
  product_type: "personal_finance_web_application"
  version_scope: "V1"

repository:
  edition: "core"
  documentation_root: "docs"
  purpose:
    - "canonical_working_repository"
    - "human_documentation"
    - "agent_orchestrator_context"
  default_branch: "main"
  text_encoding: "UTF-8"
  line_endings: "LF"
  raw_notion_export_included: false
  historical_versions_included: false

documentation:
  primary_format: "Markdown"
  tabular_format: "CSV"
  source_origin:
    type: "Notion export"
    reorganized_at: "2026-08-24"
    raw_source_in_core: false
    preservation_note: "O export bruto e versões históricas são mantidos no pacote completo de preservação, fora da edição Core."
  governance:
    orchestrator_contract: "ORCHESTRATOR.md"
    consolidation_report: "docs/governanca/relatorio-de-consolidacao.md"
    provenance_index: "docs/governanca/proveniencia.csv"
    source_inventory: "docs/governanca/inventario-fonte.csv"

product_constraints:
  v1:
    platform: "web_wordpress"
    backend_language: "PHP"
    web_platform: "WordPress"
    backend_extension_model: "custom_plugin"
    architecture_direction: "WordPress REST API + SGFP custom REST endpoints"
    identity_and_authentication: "WordPress users; email + password"
    database_family: "relational"
    database_implementation: "MySQL_or_MariaDB"
    financial_data_entry: "manual"
    automatic_bank_integration: false
    pin_enabled: false
    api_requires_authenticated_authorized_access: true
    backup_delivery: "registered_user_email"
    backup_restore_input: "user_provided_backup_file"
  future:
    pin: "optional application lock during an already authenticated session; reset by confirming account password"
  future_capabilities_are_not_v1_requirements: true

workflow:
  lifecycle_model: "stage_gated_incremental"
  current_state: "stage_6_in_progress"
  last_completed_stage:
    id: 5
    name: "Mapa do Domínio"
  current_stage:
    id: 6
    name: "Modelagem Conceitual (MER)"
  current_stage_gate:
    status: "in_progress"
    reason: "A Etapa 5 foi concluída e validada. A Etapa 6 deve utilizar a baseline documental atualizada, sem modelar estruturas exclusivas do PIN adiado."
    blockers: []

stages:
  - id: 1
    name: "Documento de Visão"
    status: "completed"
    path: "docs/projeto/documento-de-visao.md"

  - id: 2
    name: "Levantamento de Requisitos"
    status: "completed"
    path: "docs/requisitos/levantamento/"

  - id: 3
    name: "Especificação de Requisitos de Software (SRS)"
    status: "completed_reconciled_with_open_nonblocking_traceability_work"
    path: "docs/requisitos/srs/"

  - id: 4
    name: "Casos de Uso"
    status: "completed_reconciled"
    path: "docs/casos-de-uso/"

  - id: 5
    name: "Mapa do Domínio"
    status: "completed_validated"
    path: "docs/dominio/01-mapa-de-dominio.md"

  - id: 6
    name: "Modelagem Conceitual (MER)"
    status: "in_progress"
    path: "docs/modelagem-dados/01-modelagem-conceitual-mer.md"

  - id: 7
    name: "Modelo Entidade-Relacionamento (DER)"
    status: "not_started"
    path: "docs/modelagem-dados/02-modelo-entidade-relacionamento-der.md"

  - id: 8
    name: "Modelo Físico"
    status: "not_started"
    path: "docs/modelagem-dados/03-modelo-fisico.md"

  - id: 9
    name: "Arquitetura da Aplicação"
    status: "not_started"
    path: "docs/arquitetura/"

  - id: 10
    name: "Desenvolvimento da API"
    status: "not_started"
    path: "docs/api/"

  - id: 11
    name: "Desenvolvimento da Interface Web"
    status: "not_started"
    path: "docs/interface-web/"

  - id: 12
    name: "Testes"
    status: "not_started"
    path: "docs/testes/"

canonical_sources:
  process_and_stage_gates:
    path: "docs/projeto/plano-de-desenvolvimento.md"
    authority: "canonical"

  product_vision_and_scope:
    path: "docs/projeto/documento-de-visao.md"
    authority: "canonical"

  business_rules:
    path: "docs/requisitos/levantamento/"
    authority: "canonical"
    global_index: "docs/requisitos/levantamento/regras-de-negocio-index.csv"

  functional_requirements:
    path: "docs/requisitos/srs/03-requisitos-funcionais.md"
    authority: "canonical"
    catalog_size: 21
    v1_active_count: 20
    active_v1: "RF-001..RF-018, RF-020, RF-021"
    deferred:
      - "RF-019 — Gerenciar proteção por PIN"

  nonfunctional_requirements:
    path: "docs/requisitos/srs/04-requisitos-nao-funcionais.md"
    authority: "canonical"
    identifier_format: "RNF-001..RNF-020"

  restrictions_and_dependencies:
    path: "docs/requisitos/srs/06-restricoes-e-dependencias.md"
    authority: "canonical"

  acceptance_criteria:
    path: "docs/requisitos/srs/07-criterios-de-aceitacao.md"
    authority: "derived_reconciled"

  requirements_traceability:
    path: "docs/requisitos/srs/08-rastreabilidade.md"
    authority: "derived_reconciled"

  use_cases:
    path: "docs/casos-de-uso/"
    authority: "derived_reconciled"

  domain_map:
    path: "docs/dominio/01-mapa-de-dominio.md"
    authority: "validated_domain_concepts"
    note: "Organiza conceitos e relações da Etapa 5 sem substituir regras de negócio, requisitos ou Casos de Uso e sem antecipar decisões de modelagem."

  governance_report:
    path: "docs/governanca/relatorio-de-consolidacao.md"
    authority: "governance_only"

derived_indexes:
  business_rules:
    path: "docs/requisitos/levantamento/regras-de-negocio-index.csv"
    identifier_field: "rule_uid"
  requirements:
    path: "docs/requisitos/srs/requisitos-index.csv"
  use_cases:
    path: "docs/casos-de-uso/catalogo.csv"

authority_policy:
  human_decision_required_for:
    - "business_rule_ambiguity"
    - "scope_change"
    - "conflict_between_canonical_sources"
    - "addition_or_removal_of_v1_functionality"
    - "high_impact_architecture_decision"
  agents_must_not:
    - "silently_resolve_business_conflicts"
    - "promote_assumptions_to_requirements"
    - "start_future_stage_as_completed_work_before_gate"
    - "renumber_stable_identifiers_without_explicit_decision"
    - "treat_governance_reports_as_business_rule_sources"

traceability:
  target_chain:
    - "business_rule"
    - "requirement"
    - "use_case"
    - "acceptance_criterion"
    - "implementation"
    - "test_case"
    - "test_result"
  current_status: "requirements_use_cases_acceptance_consistent; business_rule_to_requirement_matrix_pending"
  blocking_issue: null
  open_nonblocking_issues:
    - "ISSUE-007"
    - "ISSUE-008"
  update_policy: "When a traceable source changes, inspect and update directly affected downstream references in the same change set."

agent_execution:
  entrypoint: "ORCHESTRATOR.md"
  context_strategy: "read_governance_first_then_load_task_relevant_sources"
  change_strategy: "minimum_sufficient_change"
  conflict_strategy: "stop_affected_work_and_request_human_decision"
  parallelism:
    isolated_branch_or_worktree: true
    explicit_file_ownership: true
    independent_review_preferred: true
  completion_report_fields:
    - "result"
    - "changed_files"
    - "sources_used"
    - "validation"
    - "decisions_or_assumptions"
    - "blockers"
    - "recommended_next_action"

git_policy:
  default_branch: "main"
  multi_agent_direct_writes_to_main: false
  isolated_work_for_parallel_tasks: true
  commit_style: "Conventional Commits"
  recommended_commit_types:
    - "docs"
    - "feat"
    - "fix"
    - "refactor"
    - "test"
    - "chore"
    - "build"
    - "ci"
  destructive_history_rewrite_requires_explicit_authorization: true
  secrets_must_not_be_committed: true

quality_policy:
  preserve_business_history: true
  preserve_traceability: true
  avoid_premature_complexity: true
  avoid_unnecessary_entities: true
  separate_business_domain_architecture_and_implementation: true
  do_not_claim_completion_with_unresolved_blocker: true

known_issues:
  - id: "ISSUE-001"
    status: "resolved"
    severity: "high"
    category: "requirements_traceability"
    decision_required: false
    blocks_stage_5: false
    summary: "O catálogo formal atual possui 19 RFs, enquanto Casos de Uso, Critérios de Aceitação e Rastreabilidade utilizam um catálogo alternativo de 25 RFs."
    affected_paths:
      - "docs/requisitos/srs/03-requisitos-funcionais.md"
      - "docs/requisitos/srs/07-criterios-de-aceitacao.md"
      - "docs/requisitos/srs/08-rastreabilidade.md"
      - "docs/casos-de-uso/"
    resolution: "Adotado catálogo reconciliado com 21 identificadores RF-001 a RF-021. Após a decisão de 30/08/2026, a V1 possui 20 RFs ativos e preserva RF-019 como requisito futuro."

  - id: "ISSUE-002"
    status: "resolved"
    severity: "high"
    category: "requirements_completeness"
    decision_required: false
    blocks_stage_5: false
    summary: "Cadastro, autenticação e senha pertencem ao escopo da V1, mas não possuem RF explícito no catálogo formal atual de 19 RFs."
    affected_paths:
      - "docs/projeto/documento-de-visao.md"
      - "docs/requisitos/levantamento/01-usuarios.md"
      - "docs/requisitos/srs/03-requisitos-funcionais.md"
      - "docs/casos-de-uso/"
    resolution: "Cadastro, autenticação e gerenciamento de senha foram formalizados respectivamente como RF-001, RF-002 e RF-003, sem ampliação do escopo V1 já documentado."

  - id: "ISSUE-003"
    status: "resolved"
    severity: "medium"
    category: "business_rule_gap"
    decision_required: false
    blocks_stage_5: false
    summary: "RF01 prevê exclusão de contas financeiras, mas o módulo de Contas não define regra de negócio para essa operação."
    affected_paths:
      - "docs/requisitos/levantamento/02-contas.md"
      - "docs/requisitos/srs/03-requisitos-funcionais.md"
      - "docs/casos-de-uso/casos/uc-005-gerenciar-contas-financeiras.md"
    resolution: "Exclusão de contas financeiras foi registrada como fora do escopo da V1; RF-004 e os artefatos derivados não a tratam como operação disponível."

  - id: "ISSUE-004"
    status: "resolved"
    severity: "medium"
    category: "business_scope"
    decision_required: false
    blocks_stage_5: false
    summary: "O escopo do registro de saldo inicial entre conta principal e contas secundárias precisa de confirmação."
    affected_paths:
      - "docs/requisitos/levantamento/02-contas.md"
      - "docs/requisitos/srs/03-requisitos-funcionais.md"
      - "docs/casos-de-uso/casos/uc-006-informar-saldo-inicial.md"
    resolution: "Não há saldo inicial armazenado. O valor inicial da conta principal é representado por Entrada; o valor de conta secundária chega por transferência com a principal; saldos e patrimônio são derivados dos movimentos."

  - id: "ISSUE-005"
    status: "resolved"
    severity: "medium"
    category: "scope_change"
    decision_required: false
    blocks_stage_5: false
    summary: "A proteção por PIN foi retirada do escopo ativo da Versão 1."
    affected_paths:
      - "docs/requisitos/levantamento/01-usuarios.md"
      - "docs/requisitos/levantamento/10-configuracoes.md"
      - "docs/requisitos/srs/03-requisitos-funcionais.md"
      - "docs/casos-de-uso/casos/uc-018-gerenciar-protecao-por-pin.md"
      - "docs/dominio/01-mapa-de-dominio.md"
    resolution: "RF-019, UC-018 e CA-019.* foram preservados para versão futura, sem renumeração. A V1 não modelará estruturas exclusivas do PIN."

  - id: "ISSUE-006"
    status: "resolved"
    severity: "medium"
    category: "technology_constraint"
    decision_required: false
    blocks_stage_5: false
    summary: "WordPress e PHP foram consolidados como restrição tecnológica da aplicação Web."
    affected_paths:
      - "docs/projeto/documento-de-visao.md"
      - "docs/projeto/plano-de-desenvolvimento.md"
      - "docs/requisitos/srs/06-restricoes-e-dependencias.md"
    resolution: "A V1 utilizará PHP sobre WordPress, backend SGFP em plugin próprio, infraestrutura REST do WordPress e MySQL/MariaDB. Identidade, autenticação e sessão ficam sob responsabilidade do WordPress."

  - id: "ISSUE-007"
    status: "open"
    severity: "medium"
    category: "business_rule_ambiguity"
    decision_required: true
    blocks_stage_6: false
    blocks_stage_9: true
    summary: "O projeto exige preservar o estado anterior durante a restauração, mas ainda não define o significado operacional dessa preservação."
    affected_paths:
      - "docs/projeto/documento-de-visao.md"
      - "docs/projeto/plano-de-desenvolvimento.md"
      - "docs/requisitos/levantamento/10-configuracoes.md"
      - "docs/requisitos/srs/07-criterios-de-aceitacao.md"
      - "docs/casos-de-uso/casos/uc-021-restaurar-copia-de-seguranca.md"
    next_action: "Obter decisão humana antes da Etapa 9 sobre como o estado imediatamente anterior à restauração deve ser preservado; não presumir mecanismo técnico."

  - id: "ISSUE-008"
    status: "open"
    severity: "medium"
    category: "requirements_traceability"
    decision_required: false
    blocks_stage_6: false
    blocks_stage_12: true
    summary: "A cadeia-alvo declara Regra de Negócio → Requisito, mas a matriz direta regra por regra ainda não foi materializada."
    affected_paths:
      - "docs/requisitos/levantamento/regras-de-negocio-index.csv"
      - "docs/requisitos/srs/08-rastreabilidade.md"
    next_action: "Executar operação específica de rastreabilidade, revisando individualmente as regras e registrando seus requisitos relacionados antes da consolidação final dos casos de teste."

resolved_consolidation_notes:
  - topic: "use_cases_location"
    status: "resolved"
    resolution: "Casos de Uso pertencem à Etapa 4 e não são subetapa do SRS."
  - topic: "category_association"
    status: "resolved_in_canonical_reorganization"
    resolution: "A árvore canônica segue a decisão mais recente consolidada para a utilização obrigatória de categoria."
  - topic: "raw_source_location"
    status: "resolved"
    resolution: "A edição Core não contém o export bruto; proveniência e inventário permanecem em docs/governanca/."
